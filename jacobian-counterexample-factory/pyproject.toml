[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobian-counterexample-factory"
version = "0.1.0"
description = "Exact generation and verification of an infinite family of constant-Jacobian, noninjective polynomial maps C^3 -> C^3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HumblePiCCI" }]
keywords = ["Jacobian conjecture", "polynomial maps", "symbolic algebra", "SymPy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jacobian-factory = "jacobian_factory.cli:main"

[project.urls]
Source = "https://github.com/HumblePiCCI/HumblePiCCI.github.io/tree/main/jacobian-counterexample-factory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
