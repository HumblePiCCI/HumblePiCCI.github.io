name: Jacobian counterexample factory

concurrency:
  group: jacobian-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "jacobian-counterexample-factory/**"
      - ".github/workflows/jacobian-counterexample-factory.yml"
  pull_request:
    paths:
      - "jacobian-counterexample-factory/**"
      - ".github/workflows/jacobian-counterexample-factory.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "./jacobian-counterexample-factory[dev]"
      - name: Test exact package
        run: pytest jacobian-counterexample-factory/tests
      - name: CLI smoke test
        run: jacobian-factory --count 4 --verify-through 8

  visualizer-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser scripts
        run: |
          node --check jacobian-counterexample-factory/visualizer/math.js
          node --check jacobian-counterexample-factory/visualizer/math.module.mjs
          node --check jacobian-counterexample-factory/visualizer/app.js
          node --check jacobian-counterexample-factory/visualizer/tour-content.js
          node --check jacobian-counterexample-factory/visualizer/tour.js
      - name: Test visualizer mathematics
        run: node --test jacobian-counterexample-factory/visualizer/tests/math.test.mjs

  visualizer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright
        run: |
          python -m pip install "playwright==1.61.0"
          python -m playwright install --with-deps chromium
      - name: Exercise the interactive lab
        env:
          JACOBIAN_LAB_URL: http://127.0.0.1:8765/jacobian-counterexample-factory/visualizer/
          JACOBIAN_LAB_RESULTS: jacobian-counterexample-factory/visualizer/tests/test-results
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/jacobian-lab-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent "$JACOBIAN_LAB_URL" > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/jacobian-lab-server.log
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent "$JACOBIAN_LAB_URL" > /dev/null
          python jacobian-counterexample-factory/visualizer/tests/browser_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacobian-fiber-lab-screenshots
          path: jacobian-counterexample-factory/visualizer/tests/test-results/*.png
          if-no-files-found: error
          retention-days: 14

  visualizer-playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jacobian-counterexample-factory/visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jacobian-counterexample-factory/visualizer/package-lock.json
      - name: Install browser suite
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the maintained Playwright suite
        run: npm run test:browser
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacobian-fiber-lab-playwright
          path: |
            jacobian-counterexample-factory/visualizer/playwright-report/
            jacobian-counterexample-factory/visualizer/test-results/
          if-no-files-found: error
          retention-days: 14
